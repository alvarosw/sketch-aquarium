<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aquário</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #031a2b;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    body.idle,
    body.idle canvas {
      cursor: none;
    }
    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 7vh;
      margin: 0;
      padding: 0 16px;
      text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: clamp(16px, 2.4vw, 30px);
      color: rgba(220, 245, 255, 0.6);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }
    #hint[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="Desenhos nadando no aquário"></canvas>
  <p id="hint" hidden>O aquário está vazio. Fotografe um desenho em /capture para ele nadar aqui.</p>
  <script type="module" src="/aquarium.js"></script>
</body>
</html>
